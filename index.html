<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2aa6b8" />
    <title>Tidebound</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="zone"></div>
    <div id="hint">Touch and drag to sail</div>
    <div id="stick"><div id="knob"></div></div>
    <button id="fireL" class="fire" data-key="Q"><b>FIRE</b><span>LEFT</span></button>
    <button id="fireR" class="fire" data-key="E"><b>FIRE</b><span>RIGHT</span></button>
    <div id="bars"></div>
    <div id="rain"></div>
    <div id="flash"></div>
    <div id="wind"></div>
    <div id="marks"></div>
    <div id="boss"><b>The Kraken</b><div class="bar"><i></i></div><div class="pips"></div></div>
    <div id="ink"><span></span><span></span></div>
    <div id="banner"></div>
    <div id="chart"></div>
    <div id="title"></div>
    <div id="panel"><div class="card"></div></div>
    <div id="hud">
      <div id="hull"><i></i></div>
      <div id="gold"><span class="coin"></span><b>0</b></div>
      <div id="gear"></div>
    </div>
    <div id="audio"></div>
    <div id="rotate"><div>Turn your phone sideways<br /><small>Tidebound is played in landscape</small></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
