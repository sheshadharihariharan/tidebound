<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2aa6b8" />
    <title>Tidebound</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="zone"></div>
    <div id="hint">Touch and drag to sail</div>
    <div id="stick"><div id="knob"></div></div>
    <button id="fireL" class="fire" data-key="Q"><b>FIRE</b><span>LEFT</span></button>
    <button id="fireR" class="fire" data-key="E"><b>FIRE</b><span>RIGHT</span></button>
    <div id="rotate"><div>Turn your phone sideways<br /><small>Tidebound is played in landscape</small></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
